<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Discovery | Oddaaa Studio</title>
  <meta name="description" content="Submit your business goals and we will propose a fixed-scope MVP.">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header><div class="nav"><a class="brand" href="/">Oddaaa Studio</a><nav><ul><li><a href="/services.html">Services</a></li><li><a href="/process.html">Process</a></li><li><a href="/pricing.html">Pricing</a></li><li><a href="/about.html">About</a></li><li><a class="btn" href="/contact.html">Book Discovery</a></li></ul></nav></div></header>
  <main>
    <h1>Book a Discovery Sprint</h1>
    <p>Tell us your current bottleneck and we will reply with a recommended MVP scope.</p>
    <form class="card" data-lead-form>
      <div class="form-grid">
        <div><label for="name">Name</label><input id="name" name="name" required></div>
        <div><label for="email">Email</label><input id="email" name="email" type="email" required></div>
        <div><label for="phone">Phone</label><input id="phone" name="phone"></div>
        <div><label for="businessName">Business Name</label><input id="businessName" name="businessName" required></div>
        <div><label for="website">Current Website</label><input id="website" name="website" placeholder="https://"></div>
        <div><label for="serviceInterest">Primary Service</label><select id="serviceInterest" name="serviceInterest" required><option value="">Select one</option><option>Marketing website + lead capture</option><option>Client intake + job tracking portal</option><option>Workflow automation + notifications</option></select></div>
        <div><label for="monthlyLeads">Monthly Lead Volume</label><input id="monthlyLeads" name="monthlyLeads" placeholder="e.g. 25-40"></div>
        <div><label for="timeline">Desired Timeline</label><input id="timeline" name="timeline" placeholder="e.g. Launch in 6 weeks"></div>
        <div><label for="budgetRange">Budget Range</label><input id="budgetRange" name="budgetRange" placeholder="e.g. 8k-12k"></div>
        <div><label for="referralSource">How did you hear about us?</label><input id="referralSource" name="referralSource"></div>
        <div class="full"><label for="goals">Project Goals</label><textarea id="goals" name="goals" required></textarea></div>
      </div>
      <p><button class="btn" type="submit" onclick="trackEvent('cta_click', {cta: 'contact_submit'})">Submit Request</button></p>
      <p class="notice" data-form-status aria-live="polite">We usually respond within one business day.</p>
    </form>
  </main>
  <footer>By submitting, you agree to be contacted about project scoping.</footer>
  <script src="/app.js"></script>
</body>
</html>
